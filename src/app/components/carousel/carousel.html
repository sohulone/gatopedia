<div class="relative overflow-hidden rounded-3xl w-full aspect-[1/0.7] bg-linear-to-br from-slate-100/35 to-slate-300/35">
  @if (loading) {
    <div class="flex flex-col items-center justify-center h-full">
      <div class="w-12 h-12 border-4 border-slate-200 border-t-lavender-blue rounded-full animate-spin"></div>
      <p class="mt-4 text-lg font-semibold text-slate-600">Cargando imágenes...</p>
    </div>
  } @else if (images.length === 0) {
    <div class="flex flex-col items-center justify-center h-full">
      <p class="text-lg font-medium text-slate-500">Selecciona una raza para ver imágenes</p>
    </div>
  } @else {
    <div class="overflow-hidden h-full" #emblaViewport>
      <div class="flex touch-pan-y touch-pinch-zoom h-full">
        @for (image of images; track image.url) {
          <div class="flex-[0_0_100%] min-w-0 relative h-full">
            <img [src]="image.url" [alt]="image.alt || 'Carousel image'" class="block w-full h-full object-cover" />
          </div>
        }
      </div>
    </div>

    @if (images.length > 1) {
      <!-- Previous Button -->
      <button 
        class="absolute z-10 top-1/2 -translate-y-1/2 left-4 appearance-none bg-white/90 touch-manipulation cursor-pointer border-0 p-0 m-0 w-12 h-12 flex items-center justify-center rounded-full transition-colors hover:bg-white disabled:opacity-30 disabled:cursor-not-allowed"
        (click)="scrollPrev()" 
        type="button"
        aria-label="Previous image">
        <svg class="w-6 h-6" viewBox="0 0 532 532">
          <path fill="currentColor" d="M355.66 11.354c13.793-13.805 36.208-13.805 50.001 0 13.785 13.804 13.785 36.238 0 50.034L201.22 266l204.442 204.61c13.785 13.805 13.785 36.239 0 50.044-13.793 13.796-36.208 13.796-50.002 0a5994246.277 5994246.277 0 0 0-229.332-229.454 35.065 35.065 0 0 1-10.326-25.126c0-9.2 3.393-18.26 10.326-25.2C172.192 194.973 332.731 34.31 355.66 11.354Z"/>
        </svg>
      </button>

      <!-- Next Button -->
      <button 
        class="absolute z-10 top-1/2 -translate-y-1/2 right-4 appearance-none bg-white/90 touch-manipulation cursor-pointer border-0 p-0 m-0 w-12 h-12 flex items-center justify-center rounded-full transition-colors hover:bg-white disabled:opacity-30 disabled:cursor-not-allowed"
        (click)="scrollNext()" 
        type="button"
        aria-label="Next image">
        <svg class="w-6 h-6" viewBox="0 0 532 532">
          <path fill="currentColor" d="M176.34 520.646c-13.793 13.805-36.208 13.805-50.001 0-13.785-13.804-13.785-36.238 0-50.034L330.78 266 126.34 61.391c-13.785-13.805-13.785-36.239 0-50.044 13.793-13.796 36.208-13.796 50.002 0 22.928 22.947 206.395 206.507 229.332 229.454a35.065 35.065 0 0 1 10.326 25.126c0 9.2-3.393 18.26-10.326 25.2-45.865 45.901-206.404 206.564-229.332 229.52Z"/>
        </svg>
      </button>
    }
  }
</div>
