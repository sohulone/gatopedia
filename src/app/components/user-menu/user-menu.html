@if (currentUser()) {
  <div class="relative">
    <button
      type="button"
      (click)="toggleUserMenu()"
      class="flex items-center gap-2 bg-white/10 hover:bg-white/20 px-3 py-2 rounded-xl transition-all"
    >
      <span class="text-2xl">{{ currentUser()!.avatar }}</span>
      <span class="text-white font-medium hidden sm:inline">{{ currentUser()!.name }}</span>
      <svg class="w-4 h-4 text-white transition-transform" [class.rotate-180]="showUserMenu()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    @if (showUserMenu()) {
      <div class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl overflow-hidden z-50">
        <div class="p-4 bg-linear-to-br from-purple-600 to-indigo-700 text-white">
          <div class="flex items-center gap-3">
            <span class="text-4xl">{{ currentUser()!.avatar }}</span>
            <div>
              <p class="font-semibold">{{ currentUser()!.name }}</p>
              <p class="text-sm text-white/80">{{ currentUser()!.email }}</p>
            </div>
          </div>
        </div>
        <div class="p-2">
          <button
            type="button"
            (click)="logout()"
            class="w-full text-left px-4 py-2 text-gray-700 hover:bg-indigo-50 hover:text-indigo-500 rounded-lg transition-colors flex items-center gap-2"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Cerrar Sesión
          </button>
        </div>
      </div>
    }
  </div>
}
