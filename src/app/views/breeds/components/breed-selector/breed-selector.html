<div class="text-center flex flex-col justify-center">
  <div class="mb-8">
    <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-700 to-indigo-700 mb-3">
      Explora las Razas
    </h1>
    <p class="text-gray-600 text-lg">Selecciona una raza para conocer más sobre ella</p>
  </div>
  <app-selector 
    label="Raza" 
    [options]="breedOptions()"
    [loading]="isLoading()"
    [value]="selectedBreedId()"
    (selectionChange)="onBreedSelected($event)">
  </app-selector>
</div>
